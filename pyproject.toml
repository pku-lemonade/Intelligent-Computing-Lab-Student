[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-computing-student"
version = "0.1.0"
description = "Student-visible starter code and public exercises for the intelligent computing course."
requires-python = ">=3.10,<3.13"
dependencies = [
    "safetensors>=0.4",
    "torch>=2.2",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["microllm*"]
